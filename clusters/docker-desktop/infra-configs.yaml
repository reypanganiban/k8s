apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
  - name: infra-controllers
  path: ./infrastructure/docker-desktop/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
